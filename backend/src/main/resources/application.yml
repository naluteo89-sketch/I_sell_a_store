server:
  port: 8080
  error:
    # 프론트에 "재고 부족" 같은 사유를 보여주기 위해
    include-message: always
  servlet:
    session:
      # 로그인 세션: 2시간 동안 아무 요청이 없으면 만료 ("로그인 상태 유지"를 고르면 14일)
      timeout: 2h
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: i-sell-a-store
  profiles:
    # 사용할 DB: mysql(기본) | h2 | postgres
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  jpa:
    hibernate:
      # 테이블 구조의 기준은 backend/db/schema.sql.
      # validate: 모델과 테이블이 다르면 서버가 시작되지 않고 어디가 다른지 알려준다 (DB를 몰래 바꾸지 않음)
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # 상품 목록에서 옵션·조합을 상품마다 따로 조회하지 않고 묶어서 가져온다 (N+1 방지)
        default_batch_fetch_size: 100

# ─────────────────────────────────────────────
# 납품 시 고객별로 바꾸는 값은 전부 여기(또는 환경변수)에 모은다.
# ─────────────────────────────────────────────
store:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  brand:
    name: ${BRAND_NAME:you_HOWMUCH}
    tagline: ${BRAND_TAGLINE:요즘 20·30을 위한 유튜버 리뷰템, 영상으로 보고 바로 담기}
    logo-url: ${BRAND_LOGO_URL:}
    primary-color: ${BRAND_PRIMARY_COLOR:#111827}
    accent-color: ${BRAND_ACCENT_COLOR:#ef4444}
    # 고객센터 전화는 두지 않음 (비우면 화면에 안 나옴)
    phone: ${BRAND_PHONE:}
    email: ${BRAND_EMAIL:naluteo89@gmail.com}
    business-info: ${BRAND_BUSINESS_INFO:대표 김다운}
  features:
    cart: ${FEATURE_CART:true}
    payment: ${FEATURE_PAYMENT:true}
    reviews: ${FEATURE_REVIEWS:false}
    youtube-panel: ${FEATURE_YOUTUBE_PANEL:true}
  youtube:
    api-key: ${YOUTUBE_API_KEY:}
    # 캐시를 이 일수가 지나면 갱신 대상으로 본다 (정책상 30일 이내 갱신 필수)
    refresh-after-days: 7
    # 이 일수를 넘긴 캐시는 무조건 삭제한다 (정책 상한)
    max-retention-days: 30
    max-results: 6
    keyword-suffix: " 리뷰"
    # 스케줄러가 하루에 쓰는 search.list 호출 상한 (기본 할당량 100회 중 일부만 사용)
    daily-refresh-budget: 40
    region-code: KR
    relevance-language: ko
  sourcing:
    # 영미권 유튜버 설명란의 달러 가격 → 원화 환산 (1달러 = ?원). 그 뒤 원화 가격 규칙 적용
    usd-krw-rate: ${USD_KRW_RATE:1400}

---
# MySQL 8 (로컬 설치본). 테이블 구조는 backend/db/schema.sql 참고.
# 계정·비밀번호는 backend/config/application.yml(깃에 안 올라감) 또는 환경변수로 넣는다.
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/my_db?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

---
# 설치 없이 바로 테스트할 때 (backend/data 폴더에 파일 DB 생성)
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:file:./data/isellastore;MODE=MySQL
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      # H2는 스크립트 없이 테스트하는 용도라 모델 기준으로 테이블을 자동 생성
      ddl-auto: update

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/isellastore}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
